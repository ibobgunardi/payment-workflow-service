services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_workflow
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payment_workflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - payment_workflow_pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_workflow
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
      PAYMENTS_GATEWAY_MAX_ATTEMPTS: 3
      PAYMENTS_OUTBOX_PUBLISH_DELAY_MS: 5000
    ports:
      - "8080:8080"

volumes:
  payment_workflow_pgdata:
